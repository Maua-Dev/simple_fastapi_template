name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testApp:
    uses: maua-dev/ci_workflows_reusable/.github/workflows/pytest_ci_311.yml@V1.2

  testApiLocalStack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Start LocalStack
        run: docker compose up -d

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack..."
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health | python -c "import json,sys; d=json.load(sys.stdin); s=d.get('services', {}); ok=s.get('lambda') in ('available','running') and s.get('apigateway') in ('available','running'); raise SystemExit(0 if ok else 1)"; then
              echo "LocalStack is ready"
              ready=1
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "LocalStack did not become ready in time"
            curl -s http://localhost:4566/_localstack/health || true
            exit 1
          fi

      - name: Deploy to LocalStack
        run: bash iac/localstack/deploy.sh

      - name: Create .env
        run: |
          echo "API_NAME=SimpleFastAPIGateway" > .env
          echo "STAGE_NAME=local" >> .env
          echo "REGION=sa-east-1" >> .env

      - name: Run API integration tests
        env:
          RUN_LOCALSTACK_TESTS: "1"
        run: pytest tests/app/test_api.py -v
